  <path d="M 100 5 Q 115 25 105 40 Q 125 20 110 55 Q 100 35 90 55 Q 75 20 95 40 Q 85 25 100 5 Z" fill="#E31E24"/>
  <path d="M 100 18 Q 110 30 104 42 Q 100 30 96 42 Q 90 30 100 18 Z" fill="#FF8C00"/>
