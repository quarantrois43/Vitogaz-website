  <circle cx="100" cy="170" r="40" fill="#00856F"/>
  <!-- Yeux -->
  <circle cx="86" cy="162" r="7" fill="white"/>
  <circle cx="114" cy="162" r="7" fill="white"/>
  <circle cx="88" cy="163" r="4" fill="#1a1a1a"/>
  <circle cx="116" cy="163" r="4" fill="#1a1a1a"/>
  <!-- Sourire -->
  <path d="M 82 178 Q 100 195 118 178" stroke="white" stroke-width="3.5" fill="none" stroke-linecap="round"/>
