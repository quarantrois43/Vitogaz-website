  <rect x="75" y="90" width="50" height="30" rx="8" fill="#004A42"/>
  <!-- Robinet -->
  <rect x="85" y="80" width="30" height="14" rx="5" fill="#E31E24"/>
  <rect x="94" y="70" width="12" height="14" rx="3" fill="#E31E24"/>
