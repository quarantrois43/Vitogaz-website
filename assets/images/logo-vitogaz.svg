<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <!-- Fond arrondi vert -->
  <rect x="0" y="4" width="50" height="50" rx="10" fill="#006B60"/>
  <!-- Ligne rouge -->
  <line x1="4" y1="50" x2="46" y2="50" stroke="#E31E24" stroke-width="4" stroke-linecap="round"/>
  <!-- Lettre V blanche -->
  <text x="25" y="40" font-family="Arial Black, sans-serif" font-size="30" font-weight="900" fill="white" text-anchor="middle">V</text>
  <!-- Texte VITOGAZ blanc -->
  <text x="60" y="30" font-family="Arial Black, sans-serif" font-size="22" font-weight="900" fill="white">VITOGAZ</text>
  <!-- Texte Madagascar rouge -->
  <text x="61" y="47" font-family="Arial, sans-serif" font-size="10" fill="#E31E24" letter-spacing="2.5">MADAGASCAR</text>
</svg>
